  - {type: variant, offset: 1382, length: 51, content: 解云：以無餘依者，除菩薩身外，更無餘依身起此定也。無餘處者，除金剛座外，無餘處所也。此定力大，餘依餘處無堅固力可能持故, 丙: 解云以無餘依者除菩薩身外更無餘依身起此定也無餘處者除金剛座外無餘處所也此定力大餘依餘處無堅固力可能持故}

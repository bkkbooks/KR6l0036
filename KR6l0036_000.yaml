front:
  text: 阿毗達磨俱舍論略釋記正議大夫持節諸軍使晉洲刺史賈曾撰昔釋迦去代過九百年天親菩薩纂論千部弘宣蓋遠發起良多至於標揭義門訓剖名相文約事廣詞微理明則此對法藏論尤稱工也雖源出婆娑本詮論藏若能究根界之旨窮世聖之源辨因果於真俗祛執滯於人我乃十二部經思已過半八萬法門由而可知豈唯但趣小乘專攻說有而已大唐三藏玄奘法師躬得梵本再譯真文其徒大乘光法師親承密誨初傳正釋既盡善矣又何加焉然論岐則說繁義富則辭黷學徒始習難以兼功有圓暉上人者慧炬熾然戒珠融朗後來之美先達所印幼好斯文長而獨得嘗因暇日見為討論余時迫俗塵倦於周覽乃求略釋先辨頌文良願不違欣然默受舊德聞已深相激讚居諸未幾刪削遽成以簡則易知有功則可久雖允在家之請乃為有學之資賢人之業其不泯矣上人自陳作意已題別序以余本緣所起欲重宣揚嘉旨再三故疏此記俾夫後身廣慧遙證通方過去衆賢永慚偏識云爾

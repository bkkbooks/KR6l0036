body:
  text: 從此大文第二明俱生諸法於中有二一正明俱起二廣辨差別就初正明俱起中一明色法俱生二明四品同起且初明色法俱生者論問起云今應思擇一切有為如相不同生亦各異為有諸法決定俱生此總問也有定俱生總答謂一切法略有五品一色二心三心所四不相應行五無為法無為無生此中不説此總標諸法意取俱生簡無為也今先辨色決定俱生別問色也頌曰欲微聚無聲無根有八事有身根九事十事有餘根釋曰欲微聚無聲無根有八事者欲謂欲界微是細義非極微也色聚極微細立微聚名為顯更無細極此者此在欲界無聲無根八事俱生隨一不減言八事者謂四大種色香味觸有身根九事者有身根聚九事俱生八事如前身為第九十事有餘根者眼耳鼻舌名有餘根此眼耳鼻舌各十事俱生且如眼根必有身根此上必有地水火風色香味觸故成十也如眼既然耳鼻舌三十事亦爾故論云眼耳鼻舌必不離身展轉相望處各別故此上兩句顯必有身下兩句明四根各別不可眼上加耳等也於前諸聚若有聲生如次數增九十十一謂前八上加聲成九前九上加聲成十前十上加聲成十一又論云以有聲處不離根生謂有執受大種因起以根上有聲義隱故此文別指也從此第二明四品同起者論云如是已辨色定俱生餘定俱生今次當辨頌曰心心所必俱諸行相或得釋曰心心所必俱者心與心所必定俱生隨闕一時餘則不起諸行相或得者諸行即是一切有為此即有四種謂色心心所心不相應行相謂四相此之諸行必與有為四相俱起故前句必俱二字流至於此應言諸行相必俱或得者得謂諸行上得也謂諸行內唯有情法與得俱生不通非情是故言或從此上來兩段不同總是第一正明俱起竟其次第二大文廣辨差別於中有二一明心所有法二明不相應行就明心所有文分四段一明五地二明定俱生三明相似殊四明衆名別就初明五地中一總標名數二別釋名體且初總標名數者論云向言心所何者是耶頌曰心所且有五大地法等異釋曰心所且有五者標心所位也大地法等異者列其數也一大地法二大善地法三大煩惱地法四大不善地法五小煩惱地法略釋大地法名者論云地謂行處若此是彼所行處即説此為彼法地釋地一字義也地是心王是心所所行處故言地謂行處也言若此者此心王也言是彼者彼心所也所行處者心是心所行處也即説此為彼法地者由心是行處故即説此心為彼心所法家地也大法地故名為大地釋大地二字也此言大者目受想等十心所也以受想等通三性等一切心品故名為大若言大地還目心王心但是地而是非大今言大地者大法之地名為大地依主釋也此中若法大地所有名大地法謂法恆於一切心有此釋大地法三字也此中者此心所中也此心所中受想等十心所法是大地家所有名大地法大地之法名大地法依主釋也故知唯言大者但目心所若言大地便目心王言大地法即還目心所法也此上有兩重依主釋善應思之此下第二別釋名體正明五地文分五段且初大地法者論云彼法是何頌曰受想思觸欲慧念與作意勝解三摩地遍於一切心釋曰前三句標列第四句釋得大地法名受謂領納此有三種苦樂俱非有差別故俱非是捨受也想者取像謂於前境取差別相思者造作謂能令心有所造作觸謂觸對根境識三和合而生能有觸對欲謂希求所作事業慧謂於法能有簡擇念謂於緣明記不忘作意者動作於意謂能令心警覺為性勝解者謂能於境印可此事如此非不如是起殊勝解三摩地者此云等持平等持心於一境轉亦持心所從強説心遍於一切心者釋得地名也此十心所遍三性等一切心品諸餘心所即不能遍故於此獨名大地法從此第二明大善地法者論云大善法地名大善地此釋大善地三字信等十心所法遍一切善心得大善名心王名大善地者是大善法所行處故大善之地依主釋也故大善地言唯目心王此中若法大善地所有名大善地法謂法恆於諸善心有此釋大善地法四字此中者此心所中謂信等十是大善地家所有法故名大善地法大善地之法依主釋也彼法是何頌曰信及不放逸輕安捨慚愧二根及不害勤唯遍善心釋曰信者澄淨也如水清珠能清濁水心有信珠令心澄淨有説於四諦三寶善惡業果忍許名信及不放逸者修諸善法論云離諸善法復何名修此難意善法即修離善之外何者名修名不放逸也謂此於善專注為性答前難也專注是修名不放逸也餘部經中有如是釋能守護心名不放逸輕安者輕謂輕利安謂安適於善法中有所堪任名心堪任性捨者捨離沈掉令心平等無警覺性慚愧二種如後當釋頌言二根者謂無貪無瞋二善根也不説無癡者無癡善根以慧為體前大地法中慧已攝竟故大善地法中不重説也言不害者謂無損惱勤者精進謂能令心勇悍為性頌言唯遍善心者釋得地名也謂唯遍善心也由前信等具此兩義一則唯是善性二則遍一切善心如大地法雖能遍善心不是唯善唯信等具二義得大善地法名也從此第三明大煩惱地法論云如是已説大善地法大煩惱法地名大煩惱地釋大煩惱地四字唯目心王心是大煩惱之地名大煩惱地依主釋也此中若法大煩惱地所有名大煩惱地法此釋大煩惱地法五字此心所中謂癡等六是大煩惱地家所有法故名大煩惱地法大煩惱地之法依主釋也故知大煩惱三字唯目癡等大煩惱地四字即目心王大煩惱地法五字還目癡等應善思之謂法恆於染污心有釋上大義也彼法是何頌曰癡逸怠不信昏掉恆唯染釋曰癡者愚癡亦名無明迷境起故亦名無智無決斷故亦名無顯無彰了故逸者放逸不修諸善是修諸善所對治法怠謂懈怠心不勇悍是前所説勤所對治不信者令心不澄淨是前所説信所對治昏者昏沈謂身心重性於善法中無所堪任亦名身心之無堪任性掉者掉舉令心不靜恆唯染者釋得地名也遍者是恆義此上六種一則唯染二則遍染具此兩義獨得大煩惱地法名且如受等雖是遍染不是唯染忿等十惑雖是唯染不是遍染故皆不得大煩惱地名也從此第四明大不善地法者論云如是已説大煩惱地法大不善法地名大不善地此釋大不善地四字目心王也心王是大不善法之地名大不善地也依主釋也此中若法大不善地所有名大不善地法謂法恆於不善心有此意釋大不善地法五字目無慚等謂無慚等是大不善地家所有法故名大不善地法大不善地之法依主釋也彼法是何頌曰唯遍不善心無慚及無愧釋曰此遍不善心者釋無慚無愧得大不善名也謂無慚無愧一則唯不善性二則遍一切不善心具此兩義獨得大不善名且如受等雖是遍不善心不是唯不善性忿等七惑除諂誑憍此七及瞋雖唯不善性不是遍不善心故皆不得大不善名此二行相如後當釋從此第五釋小煩惱地法論云如是已説大不善地法小煩惱法地名小煩惱地小煩惱三字忿等是也小煩惱地即目心王心王是小煩惱法之地名小煩惱地依主釋也此中若法小煩惱地所有名小煩惱地法此小煩惱地法五字目忿等十謂忿等是小煩惱地家所有法故名小煩惱地法小煩惱地之法依主釋也謂法少分染污心俱釋小煩惱名也不遍一切故言少分彼法是何頌曰忿覆慳嫉惱害恨諂誑憍如是類名為小煩惱地法釋曰此忿等十名小煩惱謂有三義一唯修所斷二意識地起與無明相應三各別現行具此三義故獨得名小煩惱地也且如受等十大地法癡等六大煩惱地法及無慚愧二不定中貪瞋尋伺睡眠此等諸法三義俱關慢疑二種雖與意癡相應俱闕唯修斷慢通見修斷疑唯見斷故惡作雖唯修斷闕意癡相應通善性故皆不名小煩惱地法也已上五段不同總是別釋五地名體竟從此第二明定俱生於中有二一明欲界二明上界且欲界俱生者論問云此中應説於何心品有幾心所決定俱生頌曰欲有尋伺故於善心品中二十二心所有時增惡作於不善不共見俱唯二十四煩惱忿等惡作二十一有覆有十八無覆許十二睡眠通不違若有皆增一釋曰欲曉此頌且要先知於欲界中心品有五謂善唯一不善有二一與不共無明相應謂此心品唯有無明更無餘惑二與餘貪瞋等相應無記有二一有覆無記二無覆無記今此頌文約此五品以明俱生欲有尋伺故於善心品中二十二心所者夫欲界中必有尋伺故於善心品中二十二俱生謂大地十大善地十及與尋伺有時增惡作者然此惡作通善惡性於善心中有無不定故言有時善心若有於前心品更增惡作成二十三言惡作者論有三解論云惡作者何問也惡所作體名為惡作答也於所作事起心厭惡若惡若善若作若不作俱在其境也應知此中緣惡作法説名惡作謂緣惡作心追悔性注曰於惡作事既不稱心遂生追悔即此追悔緣惡作起名為惡作惡作是境非追悔也今名追悔為惡作者從境為名也此下論文如緣空解脫門説名為空緣不淨無貪説為不淨注曰此文舉例釋成也空解脫門以定為體今名空者以緣空故從境為名不淨觀無貪為體今名不淨者緣不淨故從境為名惡作亦爾也又見世間約所依處説能依事如言一切村邑國土皆來集會惡作即是追悔所依故約所依説為惡作注曰此第二釋意者先因惡作方起追悔故知惡作追悔所依今喚追悔為惡作者於所依處顯能依事如人依村村是所依若人集會即言村來是舉所依村顯能依人也又於果體假立因名如言此六觸處應知名宿作業注曰此第三釋因是惡作果是追悔今喚追悔為惡作者此於果上立因名故如言者如經言也此六觸處眼等六根也此六觸處是果宿作業是因經言六觸處是業者亦是果上立因名也問何等惡作説名為善答謂於善惡作不作中心中追悔性謂於先時於善不作於惡而作後生追悔名善惡作也與此相違名為不善謂先作善而不作惡後生追悔名不善惡作也故此二惡作各依善惡二處而起於不善不共見俱唯二十者此明不善心品二十心所俱生也不善不共者不共無明也見者不善見也俱者謂不善心一與不共無明俱二與不善見俱也且於不善不共無明心品必有二十心所俱生謂大地十大煩惱地六大不善地二及與尋伺第二不善見相應心品者謂此心中或有邪見或有見取或有戒禁取亦有二十心所俱生名即如前不共品説於五見中除身邊見者此二見是有覆無記見也問此不善見相應心品合有二十一二十如前應加不善見何故俱言二十耶答非見增故無有二十一以即於十大地法中慧用差別説為見故見以慧為體十大地法中慧已攝竟故不重説也四煩惱忿等惡作二十一者此有三類一四煩惱者貪瞋疑慢也二忿等者十小隨煩惱也三惡作者不善中惡作也此三類心各有二十一心所俱生且四煩惱相應心品二十一者謂大地十大煩惱地六大不善地二及與尋伺此二十上加貪等隨一名二十一也忿等二十一者二十如前加忿等一不善惡作二十一者二十如前加惡作一有覆有十八者此取欲界有覆無記心也謂與身邊二見相應此二種見能覆聖道或有癡覆名為有覆不能招果故名無記此有覆心必有十八心所俱生謂大地十大煩惱地六及與尋伺此中見不增應知如前釋也無覆許十二者欲無覆心異熟生等也此有十二心所俱生謂大地十及與尋伺言許者依薩婆多宗惡作不通無記故於無覆無記心唯許有十二不同經部意惡作通無記心無記心中更加惡作故得有十三非所許也睡眠遍不違若有皆增一者睡眠通三性故於前心品遍有不違也隨何品有皆説此增謂前善中二十二上加至二十三若前二十三增至二十四不善無記準例應知從此第二明上界俱生者論云已説欲界心品俱生當説上界頌曰初定除不善及惡作睡眠中定又除尋上兼除伺等釋曰初定除不善及惡作睡眠者謂初靜慮如前欲界諸心所法唯除不善不善有十謂瞋一小煩惱中忿等七除諂誑憍及無慚愧此十煩惱唯不善性色界無有除惡作者惡作與憂根相應色界離憂故無惡作除睡眠者色界無段食故無睡眠也中定又除尋者謂中間定除前所除又更除尋餘皆具有上兼除伺等者上者二禪已上乃至非想也此二禪已上除前所除兼除伺等等取諂誑餘皆具有經説諂誑極至梵天故唯初禪得有諂誑以初禪地臣主相依必行諂誑如經中説大梵天王處自梵衆忽被馬勝苾芻問言此四大種當於何位盡滅無餘梵王不知無餘滅位便矯亂答我於此梵衆自在作者化者生者養者是一切衆生父作此語已引出衆外諂言愧謝令還問佛解云大梵天王不知依未至中間四禪此六地中起無漏道斷第四禪染及依空處近分起有漏道斷第四禪染是四大種無餘滅位故矯亂答也矯亂答辭是誑語攝也諂言愧謝顯有諂也作者我能造作世間也化者我能化世間也生者我能生一切衆生也養者我能養一切衆生也從此第三明相似殊此有兩段一明無慚等二明尋伺等且初明無慚等者論云今次當説於前所辨諸心所中少分差別無慚無愧愛之與敬差別云何頌曰無慚愧不重於罪不見怖愛敬謂信慚唯於欲色有釋曰無慚愧者標也不重者釋無慚也不重賢善名為無慚也謂於功德及有德人無敬無崇無所忌難無所隨屬説名無慚即是恭敬所敵對法言功德者戒定慧功德也有德人者具戒定慧人也無忌難者無畏懼也不隨屬者不作弟子禮也於罪不見怖者釋無愧也謂諸善士所呵厭法説名為罪於此罪中不見能招可怖畏果説名無愧此中怖言顯非愛果能生怖故有餘師説於所造罪自觀無恥説名無慚觀他無恥説名無愧慚愧差別翻此應知謂翻初釋有敬有崇有所忌難有所隨屬説名為慚於罪見怖説名為愧翻第二釋於所造罪自觀有恥説名為慚觀他有恥説名為愧愛敬謂信慚者釋愛敬差別也愛即是信敬即是慚愛謂愛樂體即是信然愛有二一有染污二無染污有染謂貪如愛妻子等無染謂信如愛師長等此頌言愛者取第二愛也有信非愛謂緣苦集信忍許故有信可厭故非愛有愛非信謂諸染污愛由起貪是愛染污非信也有通信愛謂緣滅道信忍許故生信可欣故有愛有非信愛謂除前相敬謂敬重體即是慚如前解慚謂有敬等有慚非敬謂緣苦集慚生恥有慚可厭非敬有通慚敬謂緣滅道慚恭敬有慚可欣有敬唯於欲色有者三界分別如是愛敬欲色界有無色界無問豈不信慚大善地法無色亦有答愛敬有二謂緣於法補特伽羅緣法愛敬通三界有此中意説緣補特伽羅者故欲色有無色界無補特伽羅此云數取趣謂數取諸趣也從此第二明尋伺等論云如是已説愛敬差別尋伺慢憍差別云何頌曰尋伺心麁細慢對他心舉憍由染自法心高無所顧釋曰尋伺心麁細者尋謂尋求伺謂伺察心之麁性名之為尋心之細性名之為伺復有別釋尋伺二法是諸語言行故契經言要有尋伺方有語言非無尋伺此語言行麁者名尋細者名伺語言行者是語言因也慢對他心舉者慢謂對他心自舉性稱量自他德類差別心自舉恃陵蔑於他故名為慢憍由染自法者自法謂自身色力等法也謂憍染著自法為先令心傲逸無所顧性論云有餘師説如因酒生欣舉差別説名為醉如是貪生欣舉差別説名為憍是謂憍慢差別之相已上兩段不同總是第三明相似殊竟從此第四明衆名別者論云然心心所於契經中隨義建立種種名相今當辨此名義差別頌曰心意識體一心心所有依有緣有行相相應義有五釋曰心意識體一者集起名心謂能集起三業事也思量名意了別名識復有釋言淨不淨界種種差別故名為心淨者善也不淨者惡也界者體也即此為他作所依止故名為意即此者即此心也將所依義釋意也作能依止故名為識識能依意也據上兩解是心意識三名義雖異其體一也心心所有依有緣有行相相應義有五者此釋心心所法更有四名義雖有殊體還一也一名有所依謂心心所皆名有所依託所依根故所依根者眼等六根也二名有所緣取所緣境故所緣境者色等六境也三名有行相謂同有一行相也如緣青境心及心所皆帶青上影像此識上相名為行相行謂行解即能緣心也相謂影像即行上相也行解之相名為行相依主釋也心與心所皆有青相青相雖多同一青故名同有一行相也或名有行相論云即於所緣品類差別等起行相故解云品類差別者境非一也等起者心心所齊等起也四名相應等和合故等和合者謂心心所五義平等故説相應一所依二所緣三行相四時五事皆平等故時等者謂心心所同生住異滅時故事等者事者體也一相應中如心體一諸心所法各各亦爾無兩受等共相應故上來不同總是第一明心所竟從此大文第二明不相應行於中有三一總標名數二別牒解釋三諸門分別且初總標名數者論云已説心心所廣分別義心不相應行何者是耶頌曰心不相應行得非得同分無想二定命相名身等類釋曰頌言二定者無想定滅盡定也相者四相也名身等者等取句文身也總有十四一得二非得三同分四無想果五無想定六滅盡定七命根八生九住十異十一滅十二名身十三句身十四文身此十四種體非心所不與心相應名心不相應五蘊門中是行蘊攝故名心不相應行從此第二別牒解釋於中有七一明得非得二明同分三明無想四明二定五明命根六明四相七明名身等就初第一明得非得中復分兩段一明自性二明差別且初明自性者論云於中且辨得非得相頌曰得謂獲成就非得此相違得非得唯於自相續二滅釋曰上兩句明自性下兩句明所依得謂獲成就者釋得自性得有二種一獲二成就也獲中有二一未得今獲二已失今獲故論云未得已失今獲解云未得今獲者如未得戒今受得戒創至生相將成就故名為今獲已失今獲者如先坐定遇緣便捨定名為已失後重修得創至生相將成就故名為今獲言成就者先未得法今時已得先已得者今復不失此所得法流至現在名為成就故論云得已不失名為成就故知獲時不名成就成就時不名獲也非得此相違者釋非得自性也應知非得與此相違謂若有法先未曾失及重得已但今初失此法非得創至生相名為不獲流入現存名為不成就故知不獲時不名不成就不成就時不名不獲得非得唯於自相續二滅者釋得非得所依也自相續者自即簡他也相續是身簡非相續非相續者非情是也唯於自身有得非得故論云非他相續無有成就他身法故非非相續無有成就非情法故言二滅者擇滅非擇滅也無為法中唯於二滅有得非得謂若修道證擇滅時擇滅上有得也不證時擇滅上有非得也緣闕位中得非擇滅故非擇滅上有得也緣會時不得非擇滅即非擇滅上有非得也故於二滅有得非得論云一切有情無不成就非擇滅者皆有緣闕除初剎那具縛聖者及餘一切具縛異生諸餘有情皆成擇滅初剎那聖者苦法忍是也煩惱未斷名具縛聖此聖者無擇滅也諸餘有情者一切聖人也決定無有成就虛空故於虛空不言有得以得無故非得亦無宗明得非得相翻而立故已上論文又依大毗婆沙一百五十八云得有四種一與彼法俱此是法俱得亦名如影隨形得二在彼法前此是法前得亦名牛王引前得也三在彼法後此是法後得亦名犢子隨後得四非彼法前後俱謂無為上得也其所得法則有六種一有所得法唯有俱得如異熟生等二有所得法唯有前得如三類智邊世俗智等有説此等亦有俱得應在第四類攝解云第四類者是第四所得法通俱得前得也三有所得法唯有俱得後得如別解脫戒等四有所得法唯有俱得前得如道類智忍等五有所得法具有前後俱得如所餘善染等六有所得法不可説有前後及俱而有諸得者謂擇滅非擇滅法解云第一異熟生等等取威儀工巧非數習者及有覆無記色等此等諸法勢力劣故唯法俱得第二三類智邊世俗智等等取相應心心所也謂入見道至苦集滅三類智邊能修未來俗智起法前得得之此言修者是得修也謂見道是無漏俗智是有漏故於見道俗智不起勝緣闕故得非擇滅解云勝緣者是俗智所依身也在見道中唯有見道所依身無俗智所依身故勝緣闕耳俗智既畢竟不生故無法俱法後得也問何故三類智邊能修俗智非道類智耶答二義故修一有事現觀故謂世俗智於無始來曾知苦斷集證滅今三類智亦知苦斷集證滅與世俗智同為一事故能修俗智等二當諦事周故謂於三諦可遍知苦可遍斷集可遍證滅當諦事周兼修俗智於道類智不修俗智者一俗智於道中曾無事現觀故二無遍事現觀故謂必無於道可能遍知可能遍修種性多故問何故於三諦有邊聲非道諦耶答以其能知一切苦斷一切集證一切滅而無能修一切道佛亦於道得修習修俱不盡故故無邊聲第三別解脫戒等等取惡律儀等也別解脫戒是有記故通法後得即是戒在過去現在起得成就不失也此別解脫戒不隨心色勢微劣故無法前得第四道類忍等等取相應心心所也謂道類忍是向道攝至道類智是果道攝得果道中捨向道故故道類忍無法後得第五所餘善染等等取通果等無記也除前四類外名所餘也勢力強故通三種得第六擇滅非擇滅法非三世攝故不可説前後及俱而有諸得者謂證擇滅時擇滅上有得也於緣闕位非擇滅上有得也問現在道類忍如何得有法前得耶答現在道類忍雖復唯有法俱得未來道類忍即有法前得在現在世今言現在忍有法前得者約忍種類説以所得法據種類説故又解此現在忍雖唯法俱若不現前即有法前約容有説言現在忍有法前得又解此現在忍雖唯法俱而無法前由此現在忍有法前得在未來世此未來得約世橫望實在現忍後而名法前不名法後者謂由此得不起即已起必在彼現在忍前約容起用説有前得又婆沙一百五十八云一切非得總有三種一在彼法前二在彼法後三非彼前後所不得法亦唯三種一有所不得法唯有法前非得謂未來情數畢竟不生法及入無餘涅槃最後剎那心等等取相應心所及無生智也二有所不得法通彼法前法後非得謂餘隨應有情數法三有所不得法無法前後而有非得謂擇滅非擇滅法必無非得可與法俱以法現前是所得者必有得故非所得者無得非得亦無唯有法後非得非無始來恆成就彼未捨必起彼類盡故解云第一未來情數畢竟不生法者謂是三類智邊所修俗智也此世俗智不通過現故言未來不是非情名為情數得非擇滅名畢竟不生見道已前此世俗智常有非得名法前非得三類智後常有得起更無非得也及入無餘最後心者謂未來有一類異熟威儀心作入涅槃心此心未起常有非得非得此心名法前非得此心起已必入涅槃便同非情故無法後非得無所依故又無生智未起已前常有非得名法前非得此智起已必定不退故無法後非得也非無始來恆成就彼未捨必起彼類盡故者此十六字為遮非想見惑難故謂唐三藏譯婆沙了有人以非想見惑難三藏言合唯有法後非得其難意者非想見惑無始來成無法前非得見道斷已畢竟不退於過去見惑理應合有唯法後非得何故無耶故三藏於婆沙加一十六字為通此難其十六字意者謂非想見惑未斷已前名為未捨於未捨位必無有人起未來非想見惑入過去盡以未來見惑種類無邊起不盡故及入見道斷見惑時於未來非想見惑即有法前非得故過去非想見惑約種類説不可唯有法後非得也從此第二明差別於中有二一明得差別二明非得差別就初明得差別中文復分二一正辨差別二隨難別解且初明正辨差別者論云已辨自性差別云何總問且應辨得別問頌曰三世法各三善等唯善等有繫自界得無繫得通四非學無學三非所斷二種釋曰三世法各三者三世門也三世法得各有三種謂過去法有過去得有未來得有現在得如是未來及現在法各有三種得且過去法有過去得者或是法前或是法俱或是法後此約能得與所得法今時同在過去世也然過去法唯有一得如過去世異熟生等也或有二得如過去世別解脫戒等有通三得如過去世道共戒等也若一得若二得若三得皆名過去法中過去得也故過去得通三種得宜善思之過去法家現在得者如別解脫戒落謝過去現在不失起得得之此即法在過去得居現在得居法後故過去法家現在得者唯法後得也過去法家未來得者謂法過去得在未來此未來得名法後得據世橫望雖皆法後若約起用先後未來亦有過去法家法前得也如過去世道共戒等有法前得已謝過去其法前得種類衆多起未盡者仍在未來得此未來得不起即已起必在彼過去法前得故過去法未來得者亦有法前得也宜善思之現在法家過去得者唯法前得現在法中現在得者唯法俱得現在法家未來得者名法後得據世橫望雖皆法後若論起用前後未來亦有現在法家法前得也準過去説宜善思之未來法家過去現在得者唯法前得未來法家未來得者或法前或法俱或法後未來雖無前後次第約得種類別約容起用説前後也善等唯善等者三性門也善等者所得善法也等等取不善無記法也唯善等者能得得也等取不善無記得也謂善不善及無記法如其次第有善不善無記三得有繫自界得無繫得通四者繫不繫門也有繫者三界有漏法也其有繫法得唯自界謂欲界法得唯欲界若色界法得亦色界若無色界法得亦無色界以有漏得隨所得判故有繫法隨在何界其能得得與所得同無繫者無漏法也無漏法有二種一有為無漏謂道諦也二無為無漏擇滅非擇滅也得通四者無繫法上能得得通四種也謂三界得及無漏得名為四種且非擇滅得通三界繫謂非擇滅得隨命根衆同分別判以命根衆同分通三界繫故故得通三界繫也如欲界緣闕得非擇滅得即欲界繫若色界緣闕得非擇滅得即色界繫若無色界緣闕得非擇滅得即無色界繫故論云非擇滅得通三界繫若擇滅得色無色界及與無漏解云謂擇滅得隨能證道判若有漏道證擇滅者其所引得色無色界繫以色無色有有漏道為能證故故擇滅得通彼二界然於欲界無能斷道故擇滅得不通欲界若無漏道所證擇滅其擇滅得亦唯無漏隨能證道是無漏故若道諦得唯是無漏以道諦得隨所得判道諦是無漏得亦無漏也故無繫法總而言之得通三界及與無漏四種也非學無學三者三學門也頌言非字流至無學謂非學非無學也三者能得得也謂非學非無學法得通三種一者是學二者無學三者非學非無學又頌文窄故唯標非學非無學若依論文三學具明故論云若有學法得唯有學注曰有學法者有學身中有為無漏是也以有學法是有為故得隨所得判故得亦是有學也若無學法得唯無學注曰無學法者無學身中有為無漏也以無學法是有為故得隨所得判故得亦無學也非學非無學得有差別謂此法得總説有三注曰此文正釋頌也非學非無學法雖是一其法上得即通三學故言得有差別也非學非無學法者謂一切有漏及三無為也已上論文注曰以有漏法不可修故故非有學無學身中法名非學非無學也若無為法不可修習令其增長故亦是非學無學法且有漏法唯有非學非無學得以有漏法隨所得判故能得得亦是非學非無學也非擇滅得及非聖道所引擇滅得亦如是注曰非擇滅得隨命根衆同分判非聖道得隨能證道判故此二得亦是非學非無學也亦如是者意明得同前是非學非無學也若有學道所證擇滅得亦有學隨能證道是有學故若無學道所證擇滅得亦無學隨能證道是無學故故知有漏及無為法雖是非學非無學法其能得得通三學也宜善思之非所斷二種者三斷門也非所斷者謂無漏法也二種者非所斷法上能得得通二種也一修所斷二非所斷頌文窄故唯標非所斷得若依論文三斷具明故論云又見修所斷法如其次第有見修所斷得非所斷法得有差別謂此法得總説有二此正釋頌文也有二者修非二斷也別分別者諸無漏法名非所斷無漏者道諦二滅也無漏非見修所斷名非所斷非擇滅得唯修所斷及非聖道所證擇滅得亦如是注曰此是釋非所斷法得通修所斷也非擇滅得隨所依判唯修所斷若非聖道所引得者隨能證判亦唯修斷故言亦如是也聖道所證擇滅之得及道諦得唯非所斷此文釋非所斷法得通非斷也謂聖道所引得隨能證判若道諦得隨所得判故皆非斷也從此第二隨難別解者論云前雖總説三世法各三今應簡別其中差別相頌曰無記得俱起除二通變化有覆色亦俱欲色無前起釋曰無記得俱起者無記者無覆無記也謂異熟生全威儀工巧少分取非數習者此無記法勢力劣故唯法俱得法若過去得亦過去法若未來得亦未來法若現在得亦現在除二通變化者此二通變化是通果無記有三種得前言無記得唯俱起故須除也二通者天眼耳通相應慧也能變化心者謂十四能變化心也論云天眼耳通慧及能變化心勢力強故加行差別所成辨故雖是無覆無記性收而有前後及俱起得有覆色亦俱者此明有覆無記色亦如無覆無記唯法俱得也有覆色者謂初禪有覆煩惱所發身語二色是也能發煩惱通三種得所發身語唯法俱得謂此身語雖有上品而亦不能發無表故勢力劣故由此定無法前後得欲色無前起者謂欲界繫善不善色無法前得唯法俱得及法後得以欲界色是不隨心勢微劣故無法前得是有記故通法後得從此第二明非得差別論云非得如得亦有如上品類別耶不爾云何頌曰非得淨無記去來世各三三界不繫三許聖道非得説名異生性得法易地捨釋曰非得淨無記者三性門也謂非得性無覆無記淨謂無覆也去來世各三者三世門也謂過去未來各有三世非得若現在法唯有過去未來非得無現在非得以法現在是所得者必成就故定無非得舊云現在法有非得者此翻謬矣且過去法有過去非得者或是法前或是法後此據非得與所不得法今時同在過去也若過去法現在非得者唯法後非得若過去法未來非得者據世橫望雖皆法後若論起用先後未來亦有過去法家法前非得也準得説之未來法家未來非得者或法前或法後未來雖無前後次第約性類別約容起用説前後也未來法家過去現在非得者唯法前非得也現在法中過去非得者唯法前非得也現在法中未來非得據世橫望雖皆法後若約起用先後未來亦有現在法家法前非得也三界不繫三者界繫門也三界不繫者是所不得法三者能得非得也謂三界及不繫法各有三界非得也且如彼欲界法有三界非得者謂欲界有情不得欲界法非得欲界繫色界有情不得欲界法非得色界繫無色界有情不得欲界法非得無色界繫良由非得隨所依判故隨所依通在三界如欲界法有三界非得色無色界法有三界非得準欲界説之若不繫法三界非得者欲界不得不繫法非得欲界繫色界不得不繫法非得色界繫無色不得不繫法非得無色界繫許聖道非得説名異生性者釋非得不通無漏也謂發智本論許聖道非得説名異生性故論引本論云云何異生性謂不獲聖法不獲即是非得異名非説異生性是無漏應理注曰已上論文不獲即是非得異名已下者是論主釋上兩句本論文也既知不獲聖道名異生性明知異生性必非無漏此異生性即是非得故知非得不通無漏也又婆沙四十五云尊者世友作如是説能令有情起異類見異類煩惱造異類業受異類生故名異生得法易地捨者捨非得門謂捨非得不過二門一得法捨二易地捨得法捨者如聖道非得説名異生性得聖道時捨異生性此即以得替非得處也易地捨者謂從下地生上地時若從上地生下地時以易地故必捨非得如從欲界生上界時捨欲非得以欲非得隨所依身所依捨故非得亦捨也如欲界既然餘界亦爾故易地捨但由易地捨於非得未必有得替非得處然異生性通前兩捨謂易地捨中雖不遍捨異生性盡亦有少分捨異生性如從下地生上地時亦捨下地異生性也
